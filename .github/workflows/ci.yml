---
name: Continous integration of LSP

on: [push, pull_request]

jobs:
  test:
    # ubuntu-20.04 was retired by GitHub; 22.04 is the newest image that still
    # offers a Python 3.7 build (the server pins pygls==0.11.3, a 3.6/3.7-era release).
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # No 3.6 build is available on 22.04, and 3.6 has been EOL since 2021.
        python-version: ['3.7']
    name: run tests for python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi
          # Schema-layer tests (tests/test_spec2_optional_and_label_values.py)
          # import jsonschema, which nothing in server/requirements.txt pulls in.
          # Unpinned is safe here: pip honours Requires-Python, so 3.7 resolves
          # to 4.17.3, the last release before jsonschema dropped 3.7.
          pip install jsonschema

      - name: Test with unittest
        run: |
          python -m unittest discover tests/

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

      - name: Lint Code Base
        uses: docker://github/super-linter:v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: master
          VALIDATE_PYTHON_MYPY: false

  # super-linter only checks JSON *syntax*, and the test suite is behavioural,
  # so nothing used to read the prose: four spelling/hyphenation defects shipped
  # in the spec2 schema descriptions (which a blueprint author reads on hover)
  # before a human caught them. Configuration lives in .codespellrc so that a
  # bare `codespell` run locally reproduces this job exactly.
  spellcheck:
    name: spell-check schema, docs and code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install codespell==2.4.3
      - run: codespell

  # The fixture corpus in tests/schema_fixtures/ pins the spec2 schema against
  # minimal blueprints representative of the real ones: valid fixtures must
  # validate, invalid ones must still be reported, and the valid set must cover
  # every key path the local corpus uses. The 3.7 `test` job already picks the
  # module up via `discover`; this job proves it on a current Python too, with
  # nothing installed but the two libraries it actually imports.
  # It also gates the schema's customer-facing wording, which the Torque UI shows on hover,
  # and its syntax (duplicate keys, encoding, draft, dangling $ref) - json.load alone
  # keeps the last duplicate key silently.
  schema-fixtures:
    name: validate schema against the fixture corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema
      - run: python -m unittest tests.test_schema_syntax tests.test_schema_fixtures tests.test_schema_public_voice -v
