name: Build
on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          # vsce's transitive deps require Node >= 18 (ReadableStream became a global in Node 18).
          node-version: '20.x'

      - name: clean install dependencies
        run: cd client && npm ci    
      
      - name: compile and create vsix
        run: |
          cd client
          # vsce was renamed to @vscode/vsce; the old package is deprecated.
          # @vscode/vsce still provides the `vsce` binary used by npm run vscepack.
          # The major is pinned so unpinned transitive drift cannot break the
          # pipeline again the way it just did (undici 7 needs Node >= 18).
          npm install -g @vscode/vsce@^3
          npm run compile
          npm run webpack
          npm run vscepack

