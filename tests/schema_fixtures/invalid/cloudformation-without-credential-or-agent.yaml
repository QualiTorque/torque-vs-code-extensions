# A CloudFormation grain has to say who it deploys as - a credential from the
# store, an agent, or a target that bundles both. With none of the three, the
# stack has no identity to be created with.
# expect-error: 'authentication' is a required property
# expect-error: 'agent' is a required property
# expect-error: 'target' is a required property
spec_version: 2
grains:
  stack:
    kind: cloudformation
    spec:
      source:
        store: templates
        path: templates/app.yaml
      region: example-region
