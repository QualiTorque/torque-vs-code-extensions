# The agent and credentials input types. `allowed-credential-providers` is a
# closed enum, so it is worth pinning more than one member of it.
spec_version: 2
inputs:
  execution-agent:
    type: agent
  cloud-credentials:
    type: credentials
    allowed-credential-providers:
      - aws
      - azure
      - vsphere
grains:
  app:
    kind: shell
    spec:
      agent:
        name: '{{ .inputs.execution-agent }}'
      activities:
        deploy:
          commands:
            - echo hello
