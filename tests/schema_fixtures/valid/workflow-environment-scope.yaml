# An environment-scoped workflow with both trigger kinds: a manual trigger and
# an overridable cron one.
spec_version: 2
workflow:
  scope: environment
  enabled: true
  labels-selector: tier=example
  timeout: '30'
  triggers:
    - type: manual
    - type: cron
      cron: 0 3 * * *
      overridable: true
grains:
  app:
    kind: shell
    spec:
      activities:
        deploy:
          commands:
            - echo hello
