# The store-backed half of instructions, plus the layout source. Both are a
# store/path pair and both are required in full.
spec_version: 2
instructions:
  source:
    store: docs
    path: instructions/readme.md
layout:
  source:
    store: docs
    path: layout/default.json
grains:
  app:
    kind: shell
    spec:
      activities:
        deploy:
          commands:
            - echo hello
